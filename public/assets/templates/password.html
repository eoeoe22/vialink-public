<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 확인 - VIALinks</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ecf0f3;
            font-family: "Montserrat", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #181818;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background-color: #ecf0f3;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 10px 10px 10px #d1d9e6, -10px -10px 10px #f9f9f9;
            text-align: center;
        }

        .lock-icon {
            font-size: 4rem;
            color: #4B70E2;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .password-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .form__input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: none;
            border-radius: 50px;
            background-color: #ecf0f3;
            box-shadow: inset 8px 8px 8px #d1d9e6, inset -8px -8px 8px #f9f9f9;
            font-size: 1rem;
            font-family: "Montserrat", sans-serif;
            color: #181818;
            outline: none;
            box-sizing: border-box;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            font-size: 1.2rem;
            padding: 5px;
        }

        .toggle-password:hover {
            color: #4B70E2;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: none;
            background-color: #4B70E2;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: "Montserrat", sans-serif;
            transition: 0.3s;
            box-shadow: 5px 5px 10px #d1d9e6, -5px -5px 10px #f9f9f9;
        }

        .btn:hover {
            background-color: #3a5bc7;
        }

        .btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        .error-message {
            color: #e24b4b;
            margin-top: 15px;
            display: none;
        }

        .home-link {
            margin-top: 30px;
            display: block;
        }

        .home-link a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .home-link a:hover {
            color: #4B70E2;
        }
    </style>
</head>

<body>
    <div class="container" id="main-container">
        <i class="bi bi-lock-fill lock-icon" id="lock-icon"></i>
        <div class="title" id="page-title">비밀번호 확인</div>
        <div class="subtitle" id="page-subtitle">이 링크는 비밀번호로 보호되어 있습니다.</div>

        <form id="password-form">
            <div class="password-wrapper">
                <input type="password" id="share_verify_code" name="check_code" class="form__input"
                    placeholder="공유용 임시 비밀번호" autocomplete="off">
                <button type="button" id="toggle-password" class="toggle-password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
            <button type="submit" class="btn" id="submit-btn">
                <i class="bi bi-unlock"></i> 확인
            </button>
        </form>

        <div id="error-message" class="error-message">
            <i class="bi bi-exclamation-circle"></i> <span id="error-text">비밀번호가 올바르지 않습니다</span>
        </div>

        <div id="paste-container" style="display: none; text-align: left; margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #d1d9e6; padding-bottom: 10px;">
                <h3 style="margin: 0; font-size: 1.1rem;"><i class="bi bi-file-text"></i> 내용</h3>
                <button id="copy-btn" class="btn" style="width: auto; padding: 8px 15px; font-size: 0.8rem; box-shadow: 4px 4px 8px #d1d9e6, -4px -4px 8px #f9f9f9;"><i class="bi bi-clipboard"></i> 복사</button>
            </div>
            <div id="paste-content" style="white-space: pre-wrap; word-break: break-all; background: #ecf0f3; padding: 15px; border-radius: 8px; box-shadow: inset 5px 5px 10px #d1d9e6, inset -5px -5px 10px #f9f9f9; font-family: monospace; font-size: 0.95rem; max-height: 400px; overflow-y: auto;"></div>
        </div>

        <div class="home-link">
            <a href="/"><i class="bi bi-house"></i> 홈으로 돌아가기</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const BASE64_URL_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

        function base64UrlToBytes(value) {
            if (!value || typeof value !== 'string') {
                throw new Error('복호화 데이터 형식이 올바르지 않습니다');
            }

            const len = value.length;
            const remainder = len % 4;
            const outputLength = Math.floor((len * 3) / 4);
            const output = new Uint8Array(outputLength);
            let outIndex = 0;

            for (let i = 0; i < len; i += 4) {
                const c0 = BASE64_URL_ALPHABET.indexOf(value[i] || 'A');
                const c1 = BASE64_URL_ALPHABET.indexOf(value[i + 1] || 'A');
                const c2 = BASE64_URL_ALPHABET.indexOf(value[i + 2] || 'A');
                const c3 = BASE64_URL_ALPHABET.indexOf(value[i + 3] || 'A');

                if (c0 < 0 || c1 < 0 || ((i + 2) < len && c2 < 0) || ((i + 3) < len && c3 < 0)) {
                    throw new Error('복호화 데이터 형식이 올바르지 않습니다');
                }

                const triple = (c0 << 18) | (c1 << 12) | ((c2 < 0 ? 0 : c2) << 6) | (c3 < 0 ? 0 : c3);
                if (outIndex < outputLength) output[outIndex++] = (triple >> 16) & 0xff;
                if (outIndex < outputLength && (i + 2) < len) output[outIndex++] = (triple >> 8) & 0xff;
                if (outIndex < outputLength && (i + 3) < len) output[outIndex++] = triple & 0xff;
            }

            if (remainder === 1) {
                throw new Error('복호화 데이터 형식이 올바르지 않습니다');
            }

            return output;
        }

        const key = '{{KEY}}';
        const type = '{{TYPE}}';
        const isEncrypted = {{IS_ENCRYPTED}};
        const encData = /*{{ENCRYPTED_DATA_JSON}}*/ null;

        const passwordInput = document.getElementById('share_verify_code');
        const toggleBtn = document.getElementById('toggle-password');
        const form = document.getElementById('password-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        // Toggle password visibility
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });

        // E2EE Decryption function
        async function decryptData(encryptedObj, password) {
            try {
                const decoder = new TextDecoder();

                if (encryptedObj?.kdf !== 'argon2id' || !encryptedObj?.kdf_params) {
                    throw new Error('지원하지 않는 암호화 형식입니다');
                }

                const ciphertext = base64UrlToBytes(encryptedObj.ciphertext);
                const iv = base64UrlToBytes(encryptedObj.iv);
                const salt = base64UrlToBytes(encryptedObj.salt);

                const argonResult = await argon2.hash({
                    pass: password,
                    salt,
                    time: encryptedObj.kdf_params.time,
                    mem: encryptedObj.kdf_params.mem,
                    parallelism: encryptedObj.kdf_params.parallelism,
                    hashLen: encryptedObj.kdf_params.hashLen || 32,
                    type: argon2.ArgonType.Argon2id,
                    distPath: 'https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/'
                });

                const key = await window.crypto.subtle.importKey(
                    "raw",
                    argonResult.hash,
                    { name: "AES-GCM", length: 256 },
                    false,
                    ["decrypt"]
                );

                const decrypted = await window.crypto.subtle.decrypt(
                    {
                        name: "AES-GCM",
                        iv
                    },
                    key,
                    ciphertext
                );
                return decoder.decode(decrypted);
            } catch (e) {
                console.error("Decryption error:", e);
                throw new Error("비밀번호가 틀렸거나 데이터가 손상되었습니다");
            }
        }

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = passwordInput.value;
            if (!password) {
                errorText.textContent = '비밀번호를 입력해주세요';
                errorMessage.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> 확인중...';
            errorMessage.style.display = 'none';

            if (isEncrypted && encData) {
                // E2EE Decryption Mode
                try {
                    const decrypted = await decryptData(encData, password);

                    if (type === 'url') {
                        // For URLs, normalize and redirect
                        let targetUrl = decrypted.trim();
                        if (!targetUrl.includes('://')) {
                            targetUrl = 'https://' + targetUrl;
                        }
                        window.location.href = targetUrl;
                    } else if (type === 'paste') {
                        // For Pastes, display on the same page
                        document.getElementById('password-form').style.display = 'none';
                        document.getElementById('lock-icon').className = 'bi bi-file-text lock-icon';
                        document.getElementById('page-title').textContent = '텍스트 공유';
                        document.getElementById('page-subtitle').textContent = 'Key: ' + key;

                        const pasteContent = document.getElementById('paste-content');
                        pasteContent.textContent = decrypted;
                        document.getElementById('paste-container').style.display = 'block';

                        // Set up copy button
                        document.getElementById('copy-btn').onclick = () => {
                            navigator.clipboard.writeText(decrypted).then(() => {
                                Swal.fire({
                                    icon: 'success',
                                    title: '복사 완료!',
                                    toast: true,
                                    position: 'top-end',
                                    showConfirmButton: false,
                                    timer: 2000
                                });
                            });
                        };

                        // Adjust container width for paste
                        document.getElementById('main-container').style.maxWidth = '600px';
                    }
                } catch (error) {
                    errorText.textContent = error.message || '비밀번호가 올바르지 않습니다';
                    errorMessage.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-unlock"></i> 확인';
                }
            }
        });

        // Focus on password input
        passwordInput.focus();
    </script>
</body>

</html>
