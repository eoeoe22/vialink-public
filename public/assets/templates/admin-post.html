<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 링크 생성</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #ecf0f3;
            font-family: "Montserrat", sans-serif;
            color: #181818;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header a {
            color: #4B70E2;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .card {
            background-color: #ecf0f3;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 10px 10px 10px #d1d9e6, -10px -10px 10px #f9f9f9;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: #ecf0f3;
            box-shadow: inset 4px 4px 8px #d1d9e6, inset -4px -4px 8px #f9f9f9;
            padding: 10px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-textarea {
            min-height: 180px;
            font-family: monospace;
            resize: vertical;
        }

        .btn-sm {
            padding: 8px 16px;
            border-radius: 15px;
            border: none;
            background-color: #ecf0f3;
            box-shadow: 3px 3px 6px #d1d9e6, -3px -3px 6px #f9f9f9;
            cursor: pointer;
            color: #4B70E2;
            font-weight: bold;
            font-family: inherit;
        }

        .btn-sm:hover {
            box-shadow: inset 3px 3px 6px #d1d9e6, inset -3px -3px 6px #f9f9f9;
        }

        .file-input-wrapper {
            position: relative;
        }

        .file-input-wrapper input[type="file"] {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #ecf0f3;
            box-shadow: inset 4px 4px 8px #d1d9e6, inset -4px -4px 8px #f9f9f9;
            font-family: inherit;
            box-sizing: border-box;
        }

        .preview-container {
            margin-top: 12px;
            text-align: center;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 3px 3px 6px #d1d9e6, -3px -3px 6px #f9f9f9;
        }

        .status-msg {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
        }

        .status-msg.success {
            color: #2ecc71;
        }

        .status-msg.error {
            color: #e24b4b;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>새 링크 생성</h1>
            <a href="/admin"><i class="bi bi-arrow-left"></i> 대시보드로 돌아가기</a>
        </div>

        <div class="card">
            <h2><i class="bi bi-file-code"></i> 페이지 호스팅</h2>
            <div class="form-group">
                <input id="new-page-key" class="form-input" placeholder="페이지 키 (예: about)">
            </div>
            <div class="form-group">
                <textarea id="new-page-content" class="form-textarea" placeholder="HTML 본문 입력"></textarea>
            </div>
            <button class="btn-sm" onclick="createPage()"><i class="bi bi-plus-circle"></i> 페이지 생성</button>
            <div id="page-status" class="status-msg" style="display:none;"></div>
        </div>

        <div class="card">
            <h2><i class="bi bi-file-earmark-arrow-up"></i> 파일 업로드</h2>
            <div class="form-group">
                <input id="new-image-key" class="form-input" placeholder="파일 키 (예: banner)">
            </div>
            <div class="form-group file-input-wrapper">
                <input type="file" id="new-image-file" onchange="previewFile(this)">
            </div>
            <div id="image-preview" class="preview-container" style="display:none;">
                <img id="image-preview-img" src="" alt="미리보기">
            </div>
            <button class="btn-sm" onclick="uploadImage()" style="margin-top: 12px;"><i class="bi bi-upload"></i> 파일
                업로드</button>
            <div id="image-status" class="status-msg" style="display:none;"></div>
        </div>
    </div>

    <script>
        function showStatus(elementId, message, isSuccess) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = 'status-msg ' + (isSuccess ? 'success' : 'error');
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        async function createPage() {
            const key = document.getElementById('new-page-key').value.trim();
            const content = document.getElementById('new-page-content').value;
            if (!key || !content) return showStatus('page-status', '키와 내용을 모두 입력해주세요', false);
            try {
                const res = await fetch('/api/v1/admin/page', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, content }) });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.success) {
                    showStatus('page-status', `페이지가 생성되었습니다: /${key}`, true);
                    document.getElementById('new-page-key').value = '';
                    document.getElementById('new-page-content').value = '';
                } else {
                    showStatus('page-status', data.reason || '생성 실패', false);
                }
            } catch (e) {
                showStatus('page-status', '네트워크 오류', false);
            }
        }

        function previewFile(input) {
            const preview = document.getElementById('image-preview');
            const img = document.getElementById('image-preview-img');
            if (input.files && input.files[0] && input.files[0].type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    img.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.style.display = 'none';
            }
        }

        async function uploadImage() {
            const key = document.getElementById('new-image-key').value.trim();
            const fileInput = document.getElementById('new-image-file');
            const file = fileInput.files[0];
            if (!key || !file) return showStatus('image-status', '키와 파일이 필요합니다', false);
            const formData = new FormData();
            formData.append('key', key);
            formData.append('file', file);
            try {
                const res = await fetch('/api/v1/admin/image', { method: 'POST', body: formData });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.success) {
                    showStatus('image-status', `파일이 업로드되었습니다: /${key}`, true);
                    document.getElementById('new-image-key').value = '';
                    fileInput.value = '';
                    document.getElementById('image-preview').style.display = 'none';
                } else {
                    showStatus('image-status', data.reason || '업로드 실패', false);
                }
            } catch (e) {
                showStatus('image-status', '네트워크 오류', false);
            }
        }
    </script>
</body>

</html>
