<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #ecf0f3;
            font-family: "Montserrat", sans-serif;
            color: #181818;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .card {
            background-color: #ecf0f3;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 10px 10px 10px #d1d9e6, -10px -10px 10px #f9f9f9;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #d1d9e6;
        }

        th {
            font-weight: 700;
        }

        .target-cell {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-sm {
            padding: 5px 10px;
            border-radius: 15px;
            border: none;
            background-color: #ecf0f3;
            box-shadow: 3px 3px 6px #d1d9e6, -3px -3px 6px #f9f9f9;
            cursor: pointer;
            color: #4B70E2;
            transition: 0.2s;
        }

        .btn-sm:active {
            box-shadow: 1px 1px 2px #d1d9e6, -1px -1px 2px #f9f9f9;
            transform: translateY(1px);
        }

        .delete-btn {
            color: #e24b4b;
        }

        a {
            color: #4B70E2;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>관리자 대시보드</h1>
            <button class="btn-sm" onclick="logout()">로그아웃</button>
        </div>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Target / Content</th>
                        <th>Clicks</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="links-table">
                    {{LINKS_TABLE}}
                </tbody>
            </table>
        </div>
    </div>
    <script>
        function logout() {
            document.cookie = 'admin_session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
            location.reload();
        }
        async function deleteLink(key) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            const res = await fetch(`/api/v1/admin/link/${key}`, { method: 'DELETE' });
            if (res.ok) {
                location.reload();
            } else {
                alert('삭제 실패');
            }
        }
    </script>
</body>

</html>
