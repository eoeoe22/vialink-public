<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paste - {{PASTE_KEY}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ecf0f3;
            font-family: "Montserrat", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #181818;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background-color: #ecf0f3;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 10px 10px 10px #d1d9e6, -10px -10px 10px #f9f9f9;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #d1d9e6;
        }

        .content {
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
            font-family: monospace;
            font-size: 1.1em;
            background-color: #ecf0f3;
            padding: 20px;
            border-radius: 8px;
            box-shadow: inset 5px 5px 10px #d1d9e6, inset -5px -5px 10px #f9f9f9;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            background-color: #ecf0f3;
            box-shadow: 3px 3px 6px #d1d9e6, -3px -3px 6px #f9f9f9;
            cursor: pointer;
            color: #4B70E2;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .btn:active {
            box-shadow: 1px 1px 2px #d1d9e6, -1px -1px 2px #f9f9f9;
            transform: translateY(1px);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h3><i class="bi bi-file-text"></i> Paste: {{PASTE_KEY}}</h3>
            <a href="/" class="btn"><i class="bi bi-house"></i> Home</a>
        </div>
        <div class="content">{{PASTE_CONTENT}}</div>
    </div>
</body>

</html>
